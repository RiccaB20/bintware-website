<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Enrico Baldacci · Bintware</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F1322">
<meta property="og:title" content="Enrico Baldacci · Bintware">
<meta property="og:description" content="Marketing & Vendite · Account & Clienti.">
<meta property="og:type" content="profile">
<meta property="og:url" content="https://bintware.com/card/enrico-baldacci.html">
<link rel="canonical" href="https://bintware.com/card/enrico-baldacci.html">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:           oklch(0.16 0.015 260);
    --bg-2:         oklch(0.20 0.018 260);
    --bg-3:         oklch(0.23 0.02 260);
    --ink:          oklch(0.96 0.008 80);
    --ink-dim:      oklch(0.72 0.015 80);
    --ink-mute:     oklch(0.52 0.015 80);
    --line:         oklch(0.30 0.02 260);
    --line-soft:    oklch(0.24 0.018 260);
    --accent:       oklch(0.78 0.16 55);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --display: 'Space Grotesk', system-ui, sans-serif;
    --sans: 'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  a{color:inherit;text-decoration:none}

  .stage{min-height:100vh; min-height:100dvh;display:flex; flex-direction:column; align-items:center;padding: max(24px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));position:relative; overflow-x:hidden}
  .stage::before{content:'';position:absolute;top:-200px;right:-160px;width:520px;height:520px;background:radial-gradient(closest-side, color-mix(in oklch,var(--accent) 26%, transparent), transparent 70%);filter:blur(60px);pointer-events:none;z-index:0}
  .stage::after{content:'';position:absolute;bottom:-260px;left:-160px;width:560px;height:560px;background:radial-gradient(closest-side, color-mix(in oklch,var(--bg-3) 80%, transparent), transparent 70%);filter:blur(80px);pointer-events:none;z-index:0}
  .shell{position:relative;z-index:1;width:100%;max-width:440px;display:flex;flex-direction:column;gap:22px}

  .strip{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-mute)}
  .strip .lockup{display:flex;align-items:center;gap:8px;color:var(--ink-dim)}
  .strip .lockup svg{width:18px;height:18px}
  .strip .lockup b{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:-.01em;color:var(--ink);text-transform:none}
  .logo .a{fill:none;stroke:var(--ink);stroke-width:3}
  .logo .b{fill:none;stroke:var(--accent);stroke-width:3}

  .card{position:relative;background:linear-gradient(180deg, var(--bg-2), var(--bg));border:1px solid var(--line);border-radius:22px;padding:28px 26px 30px;overflow:hidden;isolation:isolate;box-shadow:0 30px 60px -28px rgba(0,0,0,.6), 0 1px 0 0 rgba(255,255,255,.04) inset}
  .card::before{content:'';position:absolute;top:-90px;right:-90px;width:240px;height:240px;background:radial-gradient(closest-side,color-mix(in oklch,var(--accent) 26%, transparent), transparent 70%);filter:blur(20px);pointer-events:none;z-index:-1}
  .card .row1{display:flex;justify-content:space-between;align-items:flex-start;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:36px}
  .card .row1 b{color:var(--ink-dim);font-weight:500}
  .card .name{display:flex;flex-direction:column;line-height:.92;margin-bottom:30px}
  .card .name .first{font-family:var(--display);font-weight:500;font-size:54px;letter-spacing:-.04em}
  .card .name .last{font-family:var(--display);font-weight:400;font-size:54px;letter-spacing:-.04em;-webkit-text-stroke:1px color-mix(in oklch,var(--ink-dim) 90%, transparent);color:transparent}
  .card .role{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;line-height:1.55}
  .card .role .accent{color:var(--accent);display:block}
  .card .role .dim{color:var(--ink-mute)}

  .actions{display:flex;flex-direction:column;gap:10px}
  .btn{display:flex;align-items:center;gap:14px;padding:18px 18px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line-soft);color:var(--ink);cursor:pointer;transition:transform .12s ease, background .2s ease, border-color .2s ease;font-family:var(--sans);font-size:14.5px;font-weight:400;text-align:left;width:100%}
  .btn:active{transform:scale(.98)}
  .btn:hover{border-color:var(--line);background:var(--bg-3)}
  .btn .ico{width:22px;height:22px;flex-shrink:0;color:var(--accent);opacity:.95}
  .btn .lbl{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
  .btn .lbl .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-mute)}
  .btn .lbl .v{font-family:var(--display);font-size:15.5px;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btn .arr{width:18px;height:18px;flex-shrink:0;color:var(--ink-mute);transition:color .2s, transform .2s}
  .btn:hover .arr{color:var(--accent);transform:translateX(2px)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#231a0c;padding:20px 20px}
  .btn.primary:hover{background:oklch(0.84 0.16 55);border-color:oklch(0.84 0.16 55)}
  .btn.primary .ico{color:#231a0c;opacity:1}
  .btn.primary .lbl .k{color:#5a4423}
  .btn.primary .lbl .v{color:#1a120a;font-weight:600;font-size:16px}
  .btn.primary .arr{color:#5a4423}
  .btn.primary:hover .arr{color:#1a120a}

  .meta{margin-top:6px;border:1px solid var(--line-soft);border-radius:18px;background:var(--bg-2);padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:14px 22px}
  .meta .cell{display:flex;flex-direction:column;gap:5px}
  .meta .cell.full{grid-column:1 / -1}
  .meta .cell .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-mute)}
  .meta .cell .v{font-size:13.5px;color:var(--ink-dim);line-height:1.5}
  .meta .cell .v b{color:var(--ink);font-weight:500}

  .footstrip{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mute);padding-top:6px}
</style>
</head>
<body>

<main class="stage">
  <div class="shell">
    <div class="strip">
      <div class="lockup">
        <svg class="logo" viewBox="0 0 120 120"><rect class="a" x="20" y="20" width="65" height="65" rx="4"/><rect class="b" x="35" y="35" width="65" height="65" rx="4"/></svg>

    <article class="card">

        <span class="lbl"><span class="k">Scrivimi</span><span class="v">enricobaldacci57@gmail.com</span></span>
        <svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 5 7 7-7 7"/></svg>
      </a>
      <a class="btn" href="https://www.bintware.com" target="_blank" rel="noopener">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span class="lbl"><span class="k">Sito</span><span class="v">bintware.com</span></span>
        <svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>
      </a>
    </div>

    <section class="meta">
      <div class="cell">
        <div class="k">Studio</div>
        <div class="v"><b>Bintware</b></div>
      </div>
      <div class="cell">
        <div class="k">Sede</div>
        <div class="v"><b>Sovigliana-Vinci</b><br>Firenze, IT</div>
      </div>
      <div class="cell full">
        <div class="k">P. IVA</div>
        <div class="v">IT 07207160487</div>
      </div>
    </section>

    <div class="footstrip">
      <span>Studio italiano AI · Google Cloud</span>
      <span>v2 · 2026</span>
    </div>
  </div>
</main>

</body>
</html>
